    <script type="text/babel">
        const { useState, useEffect } = React;

        // Custom SVG Icons (Lucide)
        const Calendar = ({size=24, className=''}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>;
        const MapPin = ({size=24, className=''}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;

        const Crown = ({size=24, strokeWidth=2, className=''}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.518l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/></svg>;
        const ClockIcon = ({size=24, className=''}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        const CalendarDays = ({size=24, className='', hidden}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={hidden ? {display: 'none'} : {}}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>;
        const ChevronRight = ({size=24, className=''}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6"/></svg>;
        const ChevronLeft = ({size=24, className=''}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m15 18-6-6 6-6"/></svg>;
        const InfoIcon = ({size=24, className=''}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>;
        const XIcon = ({size=24, className=''}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;

        const REGULAR_DAYS = {
          0: { num: 'כד', chapter: 24 },
          1: { num: 'מח', chapter: 48 },
          2: { num: 'פב', chapter: 82 },
          3: { num: 'צד', chapter: 94 },
          4: { num: 'פא', chapter: 81 },
          5: { num: 'צג', chapter: 93 },
          6: { num: 'צב', chapter: 92 },
        };

        const HEBREW_MONTHS = [
          { en: 'Tishrei', he: 'תשרי' }, { en: 'Cheshvan', he: 'חשוון' },
          { en: 'Kislev', he: 'כסלו' }, { en: 'Tevet', he: 'טבת' },
          { en: 'Shvat', he: 'שבט' }, { en: 'Adar', he: 'אדר' },
          { en: 'Adar I', he: 'אדר א\'' }, { en: 'Adar II', he: 'אדר ב\'' },
          { en: 'Nisan', he: 'ניסן' }, { en: 'Iyyar', he: 'אייר' },
          { en: 'Sivan', he: 'סיוון' }, { en: 'Tamuz', he: 'תמוז' },
          { en: 'Av', he: 'אב' }, { en: 'Elul', he: 'אלול' }
        ];

        const YEARS_LIST = Array.from({length: 150}, (_, i) => 5700 + i);

        const PESACH_SEQ = [
          { num: 'קיד', chapter: 114 }, { num: 'עח', chapter: 78 }, { num: 'פ', chapter: 80 },
          { num: 'קה', chapter: 105 }, { num: 'קלה', chapter: 135 }, { num: 'סו', chapter: 66 },
        ];

        const SUKKOT_CHM_SEQ = [
          { num: 'כט', chapter: 29 }, { num: 'נ', chapter: 50 }, { num: 'צד (טז-כג)', chapter: '94.16-23' },
          { num: 'צד (א-טו)', chapter: '94.1-15' }, { num: 'פא', chapter: 81 }, { num: 'פב', chapter: 82 }
        ];

        const getHebrewNumber = (num) => {
          if (!num) return '';
          if (num === 15) return 'ט״ו';
          if (num === 16) return 'ט״ז';
          const units = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'];
          const tens = ['', 'י', 'כ', 'ל'];
          const result = tens[Math.floor(num / 10)] + units[num % 10];
          return result.length === 1 ? result + '׳' : result.slice(0, -1) + '״' + result.slice(-1);
        };

        const getHebrewVerseNumber = (num) => {
          if (num === 15) return 'טו';
          if (num === 16) return 'טז';
          let str = '', n = num;
          while(n >= 400) { str += 'ת'; n -= 400; }
          if (n >= 300) { str += 'ש'; n -= 300; }
          if (n >= 200) { str += 'ר'; n -= 200; }
          if (n >= 100) { str += 'ק'; n -= 100; }
          const tens = ['', 'י', 'כ', 'ל', 'מ', 'נ', 'ס', 'ע', 'פ', 'צ'];
          const units = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'];
          str += tens[Math.floor((n % 100) / 10)] + units[n % 10];
          return str;
        };

        const getHebrewYearString = (year) => {
          if (!year) return '';
          let y = year % 1000, str = '';
          while (y >= 400) { str += 'ת'; y -= 400; }
          if (y >= 300) { str += 'ש'; y -= 300; }
          if (y >= 200) { str += 'ר'; y -= 200; }
          if (y >= 100) { str += 'ק'; y -= 100; }
          const tens = ['', 'י', 'כ', 'ל', 'מ', 'נ', 'ס', 'ע', 'פ', 'צ'];
          const units = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'];
          if (y % 100 === 15) str += 'טו';
          else if (y % 100 === 16) str += 'טז';
          else str += tens[Math.floor((y % 100) / 10)] + units[y % 10];
          return str.length > 1 ? 'ה׳ ' + str.slice(0, -1) + '״' + str.slice(-1) : 'ה׳ ' + str + '׳';
        };

        const getHolidayPsalm = (holidayName, dayOfWeek, isDiaspora) => {
          // מנגנון סינון קשיח נגד כל מה שהוא "ערב" חג כדי למנוע קפיצות מוקדמות (כמו Erev Rosh Hashana)
          if (holidayName.includes('Erev')) return null;

          if (holidayName.includes('Rosh Hashana')) return { num: 'פא', chapter: 81, reason: 'ראש השנה' };
          if (holidayName.includes('Yom Kippur')) return { num: 'לב', chapter: 32, reason: 'יום כיפור' };
          if (holidayName.includes('Purim')) return { num: 'כב', chapter: 22, reason: 'פורים' };
          
          if (holidayName.includes('Shavuot')) {
             if (holidayName.includes('II') && isDiaspora) return { num: 'סח', chapter: 68, reason: 'שני של שבועות (חו"ל)' };
             if (!holidayName.includes('II')) return { num: 'יט', chapter: 19, reason: 'שבועות' };
          }
          
          if (holidayName.includes('Chanukah') && !holidayName.includes('Candle')) {
            const match = holidayName.match(/Day (\d+)/i) || holidayName.match(/(\d+)\w* Day/i);
            const num = match ? parseInt(match[1]) : 1;
            const hebLetters = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח'];
            return { num: 'ל', chapter: 30, reason: `${hebLetters[num]}' דחנוכה` };
          }
          
          const romanToArabic = { I:1, II:2, III:3, IV:4, V:5, VI:6, VII:7, VIII:8 };
          const hebLetters = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו'];

          if (holidayName.includes('Pesach')) {
             const match = holidayName.match(/Pesach ([IVX]+)/);
             if (match) {
                const dayNum = romanToArabic[match[1]];
                if (dayNum === 7) return { num: 'יח', chapter: 18, reason: 'שביעי של פסח' };
                if (dayNum === 8 && isDiaspora) {
                    if (dayOfWeek === 0) return { num: 'יח', chapter: 18, reason: 'אחרון של פסח (חו"ל)' }; // יום א'
                    return { num: 'קלו', chapter: 136, reason: 'אחרון של פסח (חו"ל)' };
                }

                if (dayNum >= 1 && dayNum <= 6) {
                   let validDaysCount = 0;
                   for (let d = 1; d <= dayNum; d++) {
                     const dow = (dayOfWeek - (dayNum - d) + 7) % 7;
                     if (dow !== 6) validDaysCount++;
                   }
                   const psalmInfo = PESACH_SEQ[Math.max(0, validDaysCount - 1)];
                   let reason = dayNum === 1 ? "א' של פסח" : (dayNum === 2 && isDiaspora) ? "ב' של פסח (חו\"ל)" : `${hebLetters[isDiaspora ? dayNum - 2 : dayNum - 1]}' דחוה"מ פסח`;
                   return { num: psalmInfo.num, chapter: psalmInfo.chapter, reason: reason };
                }
             }
          }

          let isSukkot = holidayName.includes('Sukkot');
          let isHoshanaRabba = holidayName.includes('Hoshana Rabba'); // תופס גם Rabbah
          
          if (isSukkot || isHoshanaRabba) {
              let dayNum = 0;
              if (isHoshanaRabba) {
                  dayNum = 7;
              } else {
                  const match = holidayName.match(/Sukkot ([IVX]+)/);
                  if (match) dayNum = romanToArabic[match[1]];
              }

              if (dayNum === 1) return { num: 'עו', chapter: 76, reason: 'א\' של סוכות' };
              if (dayNum === 2 && isDiaspora) return { num: 'מב', chapter: 42, reason: 'ב\' של סוכות (חו"ל)' };

              if (dayNum >= 2 && dayNum <= 7) {
                 let validChmDays = 0;
                 for (let d = 2; d <= dayNum; d++) {
                   const dow = (dayOfWeek - (dayNum - d) + 7) % 7;
                   if (dow !== 6) validChmDays++;
                 }

                 const seqIdx = Math.max(0, validChmDays - 1);
                 const psalmInfo = SUKKOT_CHM_SEQ[seqIdx];

                 let reason = isHoshanaRabba ? 'הושענא רבה' : `${hebLetters[isDiaspora ? dayNum - 2 : dayNum - 1]}' דחוה"מ סוכות`;
                 return { num: psalmInfo.num, chapter: psalmInfo.chapter, reason: reason };
              }
          }

          if (holidayName.includes('Atzeret')) return { num: 'יב', chapter: 12, reason: 'שמיני עצרת' };
          if (holidayName.includes('Simchat Torah') && isDiaspora) {
              if (dayOfWeek === 0) return { num: 'יב', chapter: 12, reason: 'שמחת תורה (חו"ל)' }; // יום א'
              return { num: 'ח', chapter: 8, reason: 'שמחת תורה (חו"ל)' };
          }

          return null;
        };

        const RulesModal = ({ isOpen, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-stone-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-4" onClick={onClose}>
                    <div className="bg-white rounded-2xl shadow-xl max-w-3xl w-full max-h-[85vh] overflow-hidden flex flex-col" dir="rtl" onClick={(e) => e.stopPropagation()}>
                        
                        <div className="flex justify-between items-center p-4 border-b border-stone-200 bg-stone-50 shrink-0">
                            <h2 className="text-xl font-bold text-stone-800 flex items-center gap-2">
                                <InfoIcon size={20} className="text-amber-600" />

                            </h2>
                            <button onClick={onClose} className="p-2 text-stone-500 hover:bg-stone-200 rounded-full transition-colors">
                                <XIcon size={20} />
                            </button>
                        </div>
                        
                        <div className="overflow-y-auto p-4 md:p-6 bg-white">
                            <p className="text-sm text-stone-600 mb-4 bg-stone-100 p-3 rounded-lg border border-stone-200">
                                <strong className="block mb-1 text-stone-800">עקרונות:</strong>
                                א. אין אומרים שני מזמורים ביום אחד.<br/>
                                ב. שיר של ראש חודש דוחה כל שיר אחר.<br/>
                                ג. שיר של שבת דוחה שיר של יום טוב ושל חנוכה.
                            </p>

                            <div className="overflow-x-auto border border-stone-800 rounded-lg">
                                <table className="w-full text-sm text-right border-collapse">
                                    <thead className="bg-stone-50 font-bold border-b border-stone-800 text-stone-800">
                                        <tr>
                                            <th className="p-2 border-l border-stone-800 w-2/5">היום</th>
                                            <th className="p-2 border-l border-stone-800 w-16 text-center">פרק</th>
                                            <th className="p-2">המזמור בתהילים</th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-stone-800 font-medium">
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">שבת</td><td className="p-2 border-l border-stone-800 text-center font-bold">צב</td><td className="p-2">מזמור שיר ליום השבת</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">ראש חודש</td><td className="p-2 border-l border-stone-800 text-center font-bold">קד</td><td className="p-2">ברכי נפשי</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">ראש השנה</td><td className="p-2 border-l border-stone-800 text-center font-bold">פא</td><td className="p-2">למנצח על הגיתית לאסף</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">יום כיפור</td><td className="p-2 border-l border-stone-800 text-center font-bold">לב</td><td className="p-2">למנצח אשרי נשוי פשע</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">חנוכה</td><td className="p-2 border-l border-stone-800 text-center font-bold">ל</td><td className="p-2">מזמור שיר חנוכת</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">פורים</td><td className="p-2 border-l border-stone-800 text-center font-bold">כב</td><td className="p-2">למנצח על אילת השחר</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">א' של פסח ביום א' ג' ה'</td><td className="p-2 border-l border-stone-800 text-center font-bold">קיד</td><td className="p-2">בצאת ישראל</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">שני של פסח בחו"ל</td><td className="p-2 border-l border-stone-800 text-center font-bold">עח</td><td className="p-2">משכיל לאסף האזינה</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">א' חול המועד פסח, ביום ב' ד' ו'</td><td className="p-2 border-l border-stone-800 text-center font-bold">עח</td><td className="p-2">משכיל לאסף האזינה</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">א' חול המועד פסח, ביום א'</td><td className="p-2 border-l border-stone-800 text-center font-bold">קיד</td><td className="p-2">בצאת ישראל</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">ב' חול המועד פסח, ביום ג' ה'</td><td className="p-2 border-l border-stone-800 text-center font-bold">פ</td><td className="p-2">למנצח אל שושנים</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">ב' חול המועד פסח, ביום ב'</td><td className="p-2 border-l border-stone-800 text-center font-bold">עח</td><td className="p-2">משכיל לאסף האזינה</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">ג' חול המועד פסח, ביום ד' ו'</td><td className="p-2 border-l border-stone-800 text-center font-bold">קה</td><td className="p-2">הודו לה' קראו בשמו</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">ג' חול המועד פסח, ביום א' ג'</td><td className="p-2 border-l border-stone-800 text-center font-bold">פ</td><td className="p-2">למנצח אל שושנים</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">ד' חול המועד פסח, ביום ה'</td><td className="p-2 border-l border-stone-800 text-center font-bold">קלה</td><td className="p-2">הללויה הללו את שם ה'</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">ד' חול המועד פסח, ביום ב' ד'</td><td className="p-2 border-l border-stone-800 text-center font-bold">קה</td><td className="p-2">הודו לה' קראו בשמו</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">ה' חול המועד פסח, ביום ו'</td><td className="p-2 border-l border-stone-800 text-center font-bold">סו</td><td className="p-2">למנצח שיר מזמור</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">ה' חול המועד פסח, ביום א', ג', ה'</td><td className="p-2 border-l border-stone-800 text-center font-bold">קלה</td><td className="p-2">הללויה הללו את שם ה'</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">שביעי של פסח ביום ב' ד' ו'</td><td className="p-2 border-l border-stone-800 text-center font-bold">יח</td><td className="p-2">למנצח לעבד ה'</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">אחרון של פסח בחו"ל ביום ג' ה'</td><td className="p-2 border-l border-stone-800 text-center font-bold">קלו</td><td className="p-2">הוֹדוּ לה' כִּי-טוֹב</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">אחרון של פסח בחו"ל ביום א'</td><td className="p-2 border-l border-stone-800 text-center font-bold">יח</td><td className="p-2">למנצח לעבד ה'</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">שבועות</td><td className="p-2 border-l border-stone-800 text-center font-bold">יט</td><td className="p-2">למנצח השמים מספרים</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">שני של שבועות בחו"ל</td><td className="p-2 border-l border-stone-800 text-center font-bold">סח</td><td className="p-2">לַמְנַצֵחַ לְדָוִד, מִזְמוֹר שִׁיר</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">חג ראשון של סוכות ביום ב' ג' ה'</td><td className="p-2 border-l border-stone-800 text-center font-bold">עו</td><td className="p-2">למנצח בנגינות מזמור לאסף</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">שני של סוכות בחו"ל</td><td className="p-2 border-l border-stone-800 text-center font-bold">מב</td><td className="p-2">לַמְנַצֵחַ, מַשְׂכִּיל לִבְנֵי-קֹרַח</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">א' חול המועד סוכות ביום א' ג' ד' ו'</td><td className="p-2 border-l border-stone-800 text-center font-bold">כט</td><td className="p-2">מזמור לדוד הבו לה'</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">ב' חול המועד סוכות ביום ב' ד' ה'</td><td className="p-2 border-l border-stone-800 text-center font-bold">נ</td><td className="p-2">מזמור לאסף אל אלוקים ה'</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">ג' חול המועד סוכות ביום ג' ה' ו'</td><td className="p-2 border-l border-stone-800 text-center font-bold text-xs whitespace-nowrap">צד, טז-כג</td><td className="p-2">מי יקום לי</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">ג' חול המועד סוכות ביום א'</td><td className="p-2 border-l border-stone-800 text-center font-bold">נ</td><td className="p-2">מזמור לאסף אל אלוקים ה'</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">ד' חול המועד סוכות ביום ד' ו'</td><td className="p-2 border-l border-stone-800 text-center font-bold text-xs whitespace-nowrap">צד, א-טו</td><td className="p-2">אל נקמות ה'-עד כל ישרי לב</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">ד' חול המועד סוכות ביום ב'</td><td className="p-2 border-l border-stone-800 text-center font-bold text-xs whitespace-nowrap">צד, טז-כג</td><td className="p-2">מי יקום לי</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">ה' חול המועד סוכות ביום ה'</td><td className="p-2 border-l border-stone-800 text-center font-bold">פא</td><td className="p-2">למנצח על הגיתית</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">ה' חול המועד סוכות ביום א' ג'</td><td className="p-2 border-l border-stone-800 text-center font-bold text-xs whitespace-nowrap">צד, א-טו</td><td className="p-2">אל נקמות ה'-עד כל ישרי לב</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">הושענא רבא ביום ו'</td><td className="p-2 border-l border-stone-800 text-center font-bold">פב</td><td className="p-2">מזמור לאסף אלוקים נצב</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">הושענא רבא ביום א' ב' ד'</td><td className="p-2 border-l border-stone-800 text-center font-bold">פא</td><td className="p-2">למנצח על הגיתית</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">שמיני עצרת ביום ב' ג' ה'</td><td className="p-2 border-l border-stone-800 text-center font-bold">יב</td><td className="p-2">למנצח על השמינית</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">שמחת תורה בחו"ל ביום ג', ד', ו'</td><td className="p-2 border-l border-stone-800 text-center font-bold">ח</td><td className="p-2">לַמְנַצֵחַ עַל-הַגִּתִּית</td></tr>
                                        <tr className="border-b border-stone-800 hover:bg-stone-50"><td className="p-2 border-l border-stone-800">שמחת תורה בחו"ל ביום א'</td><td className="p-2 border-l border-stone-800 text-center font-bold">יב</td><td className="p-2">למנצח על השמינית</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
          const [selectedDate, setSelectedDate] = useState('');
          const [dateMode, setDateMode] = useState('hebrew');
          const [isDiaspora, setIsDiaspora] = useState(false);
          const [isRulesModalOpen, setIsRulesModalOpen] = useState(false);
          
          const [loadingEvents, setLoadingEvents] = useState(true);
          const [loadingText, setLoadingText] = useState(false);
          const [error, setError] = useState(null);
          
          const [eventsList, setEventsList] = useState([]);
          const [activeEvent, setActiveEvent] = useState(null);
          const [psalmText, setPsalmText] = useState([]);
          
          const [hebrewDateStr, setHebrewDateStr] = useState('');
          const [hebYear, setHebYear] = useState('');
          const [hebMonth, setHebMonth] = useState('');
          const [hebDay, setHebDay] = useState('');

          useEffect(() => {
            handleToday();
          }, []);

          useEffect(() => {
            if (selectedDate) {
              fetchEventsForDate();
            }
          }, [selectedDate, isDiaspora]);

          useEffect(() => {
            if (activeEvent && activeEvent.chapter) {
              fetchPsalmText(activeEvent.chapter);
            }
          }, [activeEvent]);

          const handleToday = () => {
            const now = new Date();
            if (now.getHours() >= 18) now.setDate(now.getDate() + 1);
            const offsetDate = new Date(now.getTime() - (now.getTimezoneOffset() * 60000));
            setSelectedDate(offsetDate.toISOString().split('T')[0]);
          };

          const adjustDay = (amount) => {
            if (!selectedDate) return;
            const current = new Date(selectedDate);
            current.setDate(current.getDate() + amount);
            setSelectedDate(current.toISOString().split('T')[0]);
          };

          const handleHebrewDateChange = async (y, m, d) => {
            setHebYear(y); setHebMonth(m); setHebDay(d);
            try {
              const res = await fetch(`https://www.hebcal.com/converter?cfg=json&hy=${y}&hm=${m}&hd=${d}&h2g=1`);
              const data = await res.json();
              if (data.gy && data.gm && data.gd) {
                const newGreg = `${data.gy}-${String(data.gm).padStart(2, '0')}-${String(data.gd).padStart(2, '0')}`;
                setSelectedDate(newGreg); 
              }
            } catch (err) { console.error("שגיאה בהמרת תאריך עברי", err); }
          };

          const fetchEventsForDate = async () => {
            setLoadingEvents(true);
            setError(null);

            try {
              const dateObj = new Date(selectedDate);
              const year = dateObj.getFullYear();
              const month = dateObj.getMonth() + 1;
              const day = dateObj.getDate();
              const dayOfWeek = dateObj.getDay();

              const hebcalUrl = `https://www.hebcal.com/hebcal?v=1&cfg=json&maj=on&min=on&mod=on&nx=on&year=${year}&month=${month}&d=${day}&c=off&geo=none&i=${isDiaspora ? 'off' : 'on'}`;
              const converterUrl = `https://www.hebcal.com/converter?cfg=json&date=${selectedDate}&g2h=1`;
              
              const [hebcalRes, converterRes] = await Promise.all([
                  fetch(hebcalUrl), fetch(converterUrl)
              ]);
              
              const data = await hebcalRes.json();
              const convData = await converterRes.json();

              setHebrewDateStr(convData.hebrew);
              setHebYear(convData.hy);
              setHebMonth(convData.hm);
              setHebDay(convData.hd);

              const dateString = selectedDate; 
              const daysEvents = data.items ? data.items.filter(item => item.date === dateString) : [];
              
              const hebrewDays = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
              let gatheredEvents = [];
              
              gatheredEvents.push({ 
                  name: `יום ${hebrewDays[dayOfWeek]}`, 
                  chapter: REGULAR_DAYS[dayOfWeek].chapter,
                  num: REGULAR_DAYS[dayOfWeek].num,
                  isGraDefault: false 
              });

              const isShabbat = dayOfWeek === 6;
              const isRoshChodesh = daysEvents.some(e => e.title.includes('Rosh Chodesh'));
              
              if (isRoshChodesh) {
                  gatheredEvents.push({ 
                      name: 'ראש חודש', 
                      chapter: 104, 
                      num: 'קד', 
                      isGraDefault: false 
                  });
              }

              let holidayPsalmResult = null;
              for (const event of daysEvents) {
                const hp = getHolidayPsalm(event.title, dayOfWeek, isDiaspora);
                if (hp) {
                  holidayPsalmResult = hp;
                  gatheredEvents.push({ 
                      name: hp.reason, 
                      chapter: hp.chapter, 
                      num: hp.num, 
                      isGraDefault: false 
                  });
                }
              }

              let winnerName = '';
              if (isRoshChodesh) {
                winnerName = 'ראש חודש';
              } else if (isShabbat) {
                winnerName = 'יום שבת';
              } else if (holidayPsalmResult) {
                winnerName = holidayPsalmResult.reason;
              } else {
                winnerName = `יום ${hebrewDays[dayOfWeek]}`;
              }

              const defaultEv = gatheredEvents.find(e => e.name === winnerName);
              
              setEventsList(gatheredEvents);
              if (defaultEv) {
                  defaultEv.isGraDefault = true;
                  setActiveEvent(defaultEv);
              } else {
                  setActiveEvent(gatheredEvents[0]);
              }
              
            } catch (err) {
              console.error("Fetch Events Error:", err);
              setError('אירעה שגיאה בטעינת הנתונים מהשרת. נסה שוב.');
            } finally {
              setLoadingEvents(false);
            }
          };

          const fetchPsalmText = async (chapterInfo) => {
            setLoadingText(true);
            setError(null);
            try {
              const sefariaUrl = `https://www.sefaria.org/api/texts/Psalms.${chapterInfo}?context=0&he=1`;
              const sefariaRes = await fetch(sefariaUrl);
              const sefariaData = await sefariaRes.json();

              if (sefariaData.he) {
                const textArray = Array.isArray(sefariaData.he) ? sefariaData.he : [sefariaData.he];
                if (textArray.length > 0) {
                    setPsalmText(textArray);
                } else {
                    setError('לא נמצא טקסט עבור פרק זה בשרת.');
                }
              } else {
                setError('שגיאה בקבלת הטקסט מ-Sefaria.');
              }
            } catch(err) {
              console.error("Fetch Psalm Error:", err);
              setError('אירעה שגיאה בטעינת פסוקי התהילים.');
            } finally {
              setLoadingText(false);
            }
          };

          const createMarkup = (htmlString) => {
            return { __html: typeof htmlString === 'string' ? htmlString : '' };
          };

          const getStartVerseOffset = () => {
              if (!activeEvent || !activeEvent.chapter || typeof activeEvent.chapter.toString !== 'function') return 0;
              const chapterStr = activeEvent.chapter.toString();
              if (!chapterStr.includes('.')) return 0;
              const match = chapterStr.match(/\.(\d+)/);
              return match ? parseInt(match[1], 10) - 1 : 0;
          };

          return (
            <div className="min-h-screen bg-stone-100 font-sans text-right flex flex-col" dir="rtl">
              
              <RulesModal isOpen={isRulesModalOpen} onClose={() => setIsRulesModalOpen(false)} />

              <header className="bg-white shadow-sm border-b border-stone-200 py-6 px-4 shrink-0 text-center relative z-10">
                <div className="max-w-4xl mx-auto flex flex-col items-center">
                    <div className="flex justify-center mb-3 text-amber-700">
                        <BookOpen size={36} strokeWidth={1.5} />
                    </div>
                    <h1 className="text-3xl font-bold text-stone-800 mb-2">שיר של יום</h1>
                    <p className="text-stone-500 mb-4 text-sm font-medium">לפי מנהג הגר"א מווילנא</p>
                    
                    {hebrewDateStr && (
                        <div className="text-xl md:text-2xl font-serif text-amber-900 bg-amber-50 px-6 py-2 rounded-full border border-amber-200 shadow-sm inline-block">
                        {hebrewDateStr}
                        </div>
                    )}
                </div>
              </header>

              <main className="flex-grow flex flex-col p-4 md:p-8 relative max-w-4xl mx-auto w-full">
                  {(loadingEvents || loadingText) ? (
                    <div className="flex flex-col items-center justify-center flex-grow text-amber-600 my-12">
                      <Loader2 className="animate-spin mb-4" size={40} />
                      <p className="text-stone-600 font-medium">{loadingEvents ? 'מחשב זמנים ומועדים...' : 'טוען פסוקים...'}</p>
                    </div>
                  ) : error ? (
                    <div className="flex flex-col items-center justify-center flex-grow text-red-500 bg-white p-8 rounded-2xl shadow-sm border border-stone-200 my-12">
                      <AlertCircle size={48} className="mb-4" />
                      <p className="text-center font-medium">{error}</p>
                    </div>
                  ) : activeEvent && (
                    <div className="bg-white rounded-2xl shadow-lg border border-stone-200 p-6 md:p-10 mb-8 animate-in fade-in duration-500">
                      
                      <div className="flex flex-wrap justify-center gap-3 mb-10 border-b border-stone-100 pb-8">
                         {eventsList.map((ev, idx) => {
                            const isActive = activeEvent.name === ev.name;
                            return (
                                <button 
                                    key={idx} 
                                    onClick={() => setActiveEvent(ev)}
                                    className={`flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium transition-all ${
                                        isActive 
                                            ? 'bg-amber-100 text-amber-900 border-2 border-amber-400 shadow-sm' 
                                            : 'bg-stone-50 text-stone-600 border border-stone-200 hover:bg-stone-100'
                                    }`}
                                >
                                    {ev.name}
                                    {ev.isGraDefault && (
                                        <Crown 
                                            size={16} 
                                            strokeWidth={2.5} 
                                            className={isActive ? "text-amber-600" : "text-stone-400"} 
                                            title='פסיקת הגר"א ליום זה'
                                        />
                                    )}
                                </button>
                            )
                         })}
                      </div>

                      <div className="text-center mb-10">
                        <h3 className="text-4xl md:text-5xl font-serif font-bold text-stone-800 tracking-tight">
                          פרק {activeEvent.num}
                        </h3>
                      </div>
                      
                      <div className="text-xl md:text-2xl leading-relaxed md:leading-loose text-stone-800 font-serif pb-6">
                        {psalmText.map((verse, index) => {
                          if (!verse) return null;
                          const absoluteVerseNum = getStartVerseOffset() + index + 1;
                          return (
                            <div key={index} className="mb-4 flex gap-4">
                                <span className="text-stone-400 text-base select-none mt-2 w-8 text-left shrink-0 font-sans">
                                {getHebrewVerseNumber(absoluteVerseNum)}
                                </span>
                                <p dangerouslySetInnerHTML={createMarkup(verse)} className="flex-1" />
                            </div>
                          );
                        })}
                      </div>

                    </div>
                  )}
              </main>

              <footer className="bg-stone-800 text-stone-200 py-6 px-4 shrink-0 border-t-4 border-amber-600 z-10 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] pb-10 md:pb-6">
                <div className="max-w-5xl mx-auto flex flex-col items-center gap-6">
                    
                    <div className="flex flex-col md:flex-row justify-center items-center gap-4 w-full">
                        <button 
                          onClick={handleToday}
                          className="flex items-center justify-center gap-2 bg-stone-700 hover:bg-stone-600 text-white px-5 py-2.5 rounded-lg text-sm transition-colors font-medium w-full md:w-auto shrink-0 shadow-sm"
                        >
                          <ClockIcon size={16} />
                          הצג את היום
                        </button>

                        <div className="h-8 w-px bg-stone-600 hidden md:block"></div>

                        <div className="flex bg-stone-900 p-1 rounded-lg w-full md:w-auto shrink-0">
                          <button 
                            onClick={() => setDateMode('hebrew')} 
                            className={`flex-1 md:flex-none px-4 py-2 rounded-md text-sm transition-all ${dateMode === 'hebrew' ? 'bg-stone-700 font-medium text-white shadow-sm' : 'text-stone-400 hover:text-stone-300'}`}
                          >
                            עברי
                          </button>
                          <button 
                            onClick={() => setDateMode('gregorian')} 
                            className={`flex-1 md:flex-none px-4 py-2 rounded-md text-sm transition-all ${dateMode === 'gregorian' ? 'bg-stone-700 font-medium text-white shadow-sm' : 'text-stone-400 hover:text-stone-300'}`}
                          >
                            לועזי
                          </button>
                        </div>

                        <div className="flex items-center gap-1 w-full md:w-auto">
                            <button 
                                onClick={() => adjustDay(-1)} 
                                className="bg-stone-700 hover:bg-stone-600 p-2.5 rounded-lg transition-colors text-stone-300 hover:text-white shrink-0"
                                title="יום קודם"
                            >
                                <ChevronRight size={18} />
                            </button>

                            {dateMode === 'gregorian' ? (
                              <div className="flex items-center gap-2 bg-stone-700 px-4 py-2 rounded-lg w-full md:w-auto shadow-sm">
                                <Calendar className="text-stone-400 shrink-0" size={18} />
                                <input 
                                  type="date" 
                                  value={selectedDate}
                                  onChange={(e) => setSelectedDate(e.target.value)}
                                  className="bg-transparent text-white outline-none w-full color-scheme-dark"
                                  style={{ colorScheme: 'dark' }}
                                />
                              </div>
                            ) : (
                              <div className="flex items-center gap-2 bg-stone-700 px-2 py-2 rounded-lg text-white w-full justify-center shadow-sm flex-1 md:flex-none h-10 min-w-0">
                                 <CalendarDays className="text-stone-400 shrink-0 hidden md:block" size={18} />
                                 <select 
                                    value={hebDay} 
                                    onChange={e => handleHebrewDateChange(hebYear, hebMonth, Number(e.target.value))} 
                                    className="bg-transparent outline-none cursor-pointer p-0 md:p-1 appearance-none text-center hover:bg-stone-600 rounded flex-1 truncate"
                                 >
                                   {[...Array(30).keys()].map(i => <option key={i+1} value={i+1} className="bg-stone-800">{getHebrewNumber(i+1)}</option>)}
                                 </select>
                                 <span className="text-stone-500 shrink-0">/</span>
                                 <select 
                                    value={hebMonth} 
                                    onChange={e => handleHebrewDateChange(hebYear, e.target.value, hebDay)} 
                                    className="bg-transparent outline-none cursor-pointer p-0 md:p-1 appearance-none text-center hover:bg-stone-600 rounded flex-1 truncate"
                                 >
                                   {HEBREW_MONTHS.map(m => <option key={m.en} value={m.en} className="bg-stone-800">{m.he}</option>)}
                                 </select>
                                 <span className="text-stone-500 shrink-0">/</span>
                                 <select 
                                    value={hebYear} 
                                    onChange={e => handleHebrewDateChange(Number(e.target.value), hebMonth, hebDay)} 
                                    className="bg-transparent outline-none cursor-pointer p-0 md:p-1 appearance-none text-center hover:bg-stone-600 rounded flex-1 truncate"
                                 >
                                    {YEARS_LIST.map(y => (
                                      <option key={y} value={y} className="bg-stone-800">{getHebrewYearString(y)}</option>
                                    ))}
                                 </select>
                              </div>
                            )}

                            <button 
                                onClick={() => adjustDay(1)} 
                                className="bg-stone-700 hover:bg-stone-600 p-2.5 rounded-lg transition-colors text-stone-300 hover:text-white shrink-0"
                                title="יום הבא"
                            >
                                <ChevronLeft size={18} />
                            </button>
                        </div>
                        
                        <div className="h-8 w-px bg-stone-600 hidden md:block"></div>

                        <div className="flex items-center gap-1 bg-stone-900 p-1 rounded-lg w-full md:w-auto shrink-0 shadow-sm">
                          <button
                            onClick={() => setIsDiaspora(false)}
                            className={`flex-1 md:flex-none flex items-center justify-center gap-1 px-4 py-2 rounded-md transition-colors text-sm ${!isDiaspora ? 'bg-amber-600 text-white font-medium' : 'text-stone-400 hover:bg-stone-800'}`}
                          >
                            <MapPin size={16} />
                            בארץ
                          </button>
                          <button
                            onClick={() => setIsDiaspora(true)}
                            className={`flex-1 md:flex-none flex items-center justify-center gap-1 px-4 py-2 rounded-md transition-colors text-sm ${isDiaspora ? 'bg-amber-600 text-white font-medium' : 'text-stone-400 hover:bg-stone-800'}`}
                          >
                            בחו"ל
                          </button>
                        </div>
                    </div>

                    <div className="w-full flex justify-center border-t border-stone-700 pt-4">
                        <button 
                            onClick={() => setIsRulesModalOpen(true)}
                            className="flex items-center gap-2 text-stone-400 hover:text-amber-400 transition-colors text-sm font-medium"
                        >
                            <InfoIcon size={16} />
                            הצג את לוח הכללים השלם (כפי שמופיע בלוחות)
                        </button>
                    </div>
                    
                </div>
              </footer>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW Registered!', reg))
                    .catch(err => console.error('SW Failed:', err));
            });
        }
    </script>
</body>
</html>
